name: Publish GitHub package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v0.5.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@sajeetharan"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run validate

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Publish scoped package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@sajeetharan/create-cosmos-agent"
          npm publish --ignore-scripts --access public --registry=https://npm.pkg.github.com
